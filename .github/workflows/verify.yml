name: verify

# Vercel builds every push to main, but `next build` does not run ESLint in
# Next 16 and never runs the test suite — so a push can deploy green while
# lint and tests are broken. This workflow is the gate Vercel does not provide.
#
# It deliberately does NOT touch the database. Schema changes stay a manual,
# deliberate step (see AGENTS.md); `prisma generate` only reads the schema file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # tsc --noEmit, then eslint, then jest.
      - name: Verify
        run: npm run verify

      # Catches build-only failures that tsc misses, e.g. a server component
      # importing something client-only. No real secrets: the build must not
      # need them, and if it ever does that is the bug.
      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
