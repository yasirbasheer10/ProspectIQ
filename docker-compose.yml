version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_revenue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airevenue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airevenue_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ai_revenue_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airevenue}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
